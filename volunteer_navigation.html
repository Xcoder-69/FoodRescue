<script>
        let isExpanded = false;
        const drawer = document.getElementById('drawer');

        function toggleDrawer() {
            if (isExpanded) {
                drawer.style.transform = 'translateY(0)';
            } else {
                // Peek height logic if needed, currently it sits at the bottom anyway
            }
            isExpanded = !isExpanded;
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLeafletMap();
        });

        function initLeafletMap() {
            const map = L.map('map-container', { zoomControl: false }).setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        map.setView([lat, lng], 15);
                        
                        const customIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: '<div class="w-4 h-4 bg-tertiary rounded-full border-2 border-white shadow-md"></div>',
                            iconSize: [16, 16],
                            iconAnchor: [8, 8]
                        });
                        L.marker([lat, lng], {icon: customIcon}).addTo(map);
                    },
                    (error) => {
                        console.warn('Geolocation failed or denied:', error);
                    },
                    { timeout: 10000 }
                );
            }
        }

        // Touch swipe simulation for drawer
        let startY = 0;
        drawer.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        drawer.addEventListener('touchmove', (e) => {
            let moveY = e.touches[0].clientY;
            let diff = moveY - startY;
            if (diff > 0) {
                // Prevent over-pulling down if you want
            }
        });

        // API Fetch Logic
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.ApiClient) {
                try {
                    const res = await ApiClient.get('/donations');
                    // Find active donation for volunteer
                    const activeDonation = (res.data || []).find(d => d.status === 'CLAIMED' || d.status === 'ASSIGNED');
                    
                    if (activeDonation) {
                        const fromName = activeDonation.restaurantName || 'Restaurant';
                        const toName = activeDonation.ngoName || 'NGO Kitchen';
                        const foodTitle = activeDonation.foodDetails?.title || activeDonation.title || 'Food Donation';
                        const weight = activeDonation.foodDetails?.quantity || activeDonation.weight || '0';
                        
                        document.getElementById('nav-from').textContent = fromName;
                        document.getElementById('nav-to').textContent = toName;
                        document.getElementById('nav-food-details').textContent = `${weight}kg ${foodTitle}`;
                        
                        document.getElementById('btn-arrive').addEventListener('click', () => {
                            window.location.href = `delivery_confirmation.html?id=${activeDonation.id}`;
                        });
                    } else {
                        // Fallback if no active donation
                        document.getElementById('btn-arrive').addEventListener('click', () => {
                            window.location.href = 'delivery_confirmation.html';
                        });
                    }
                } catch(e) {
                    console.error('Failed to load navigation details', e);
                    document.getElementById('btn-arrive').addEventListener('click', () => {
                        window.location.href = 'delivery_confirmation.html';
                    });
                }
            }
        });
    </script>
